name: Test setup scripts

on:
  push:
    paths:
      - "setup-linux.sh"
      - "setup-mac.sh"
      - "setup-windows.ps1"
      - "setup-common.ts"
      - "setup-lib.sh"
      - "check-docs-sync.sh"
      - "SETUP.md"
      - "SETUP_ko.md"
      - "install.md"
      - "README.md"
      - "README_ko.md"
      - ".github/workflows/test-setup.yml"
  pull_request:
    paths:
      - "setup-linux.sh"
      - "setup-mac.sh"
      - "setup-windows.ps1"
      - "setup-common.ts"
      - "setup-lib.sh"
      - "check-docs-sync.sh"
      - "SETUP.md"
      - "SETUP_ko.md"
      - "install.md"
      - "README.md"
      - "README_ko.md"
      - ".github/workflows/test-setup.yml"

# Pushing a branch with an open PR fires this workflow twice for the same
# commit (push + pull_request events), doubling every run — and linux-dry-run
# is a full install. Key the group on the head branch so the newer of the two
# cancels the older instead of both queueing full installs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check SETUP.md / SETUP_ko.md flags are in sync with scripts
        run: bash check-docs-sync.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck -S warning setup-linux.sh setup-mac.sh setup-lib.sh

  linux-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install sudo and curl (base image lacks them)
        run: apt-get update -q && apt-get install -y -q sudo curl
      - name: Create non-root user
        run: |
          useradd -m -s /bin/bash runner
          echo "runner ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R runner:runner "$GITHUB_WORKSPACE"
      - name: Run setup-linux.sh
        run: su runner -c "bash setup-linux.sh"
        working-directory: ${{ github.workspace }}
      - name: Run setup-common.ts verification
        run: su runner -c "bash -lc 'export PATH=\$HOME/.bun/bin:\$PATH && bun setup-common.ts --json'"
        working-directory: ${{ github.workspace }}

  windows-syntax-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup-windows.ps1 (syntax only, no execution)
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("setup-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host "Parsed OK"
